plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
    id "maven-publish"
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'net.fabricmc.fabric-loom-remap'

    version = project.steamlayer_version
    group = "net.voxelindustry"

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

        compileOnly 'org.jetbrains:annotations:22.0.0'

        compileOnly "org.projectlombok:lombok:${rootProject.lombok_version}"
        annotationProcessor "org.projectlombok:lombok:${rootProject.lombok_version}"

        testImplementation(platform('org.junit:junit-bom:5.13.4'))
        testImplementation('org.junit.jupiter:junit-jupiter')
        testImplementation('org.mockito:mockito-core:5.20.0')
        testImplementation('org.mockito:mockito-junit-jupiter:5.20.0')
        testImplementation('org.assertj:assertj-core:3.27.6')

        testRuntimeOnly('org.junit.platform:junit-platform-launcher')

        testCompileOnly "org.projectlombok:lombok:${rootProject.lombok_version}"
        testAnnotationProcessor "org.projectlombok:lombok:${rootProject.lombok_version}"
    }

    test {
        useJUnitPlatform()
        failOnNoDiscoveredTests = false
    }

    processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }

        repositories {
            maven {
                name = "Gitea"
                url = uri("https://git.ferenyr.fr/api/packages/VoidxelIndustries/maven")

                credentials(HttpHeaderCredentials) {
                    name = "Authorization"
                    value = "token ${gitea_token}"
                }

                authentication {
                    header(HttpHeaderAuthentication)
                }
            }
            mavenLocal()
        }
    }

    tasks.publish.dependsOn build
}

base.archivesName = "steamlayer"

subprojects {
}

project('steamlayer-common') {
    base.archivesName = "steamlayer-common"

    dependencies {
    }
}

project('steamlayer-test') {
    base.archivesName = "steamlayer-test"

    dependencies {
        implementation(platform('org.junit:junit-bom:5.13.4'))
        implementation('org.junit.jupiter:junit-jupiter-api')
        implementation('org.mockito:mockito-core:5.20.0')
        implementation('org.mockito:mockito-junit-jupiter:5.20.0')
        implementation('org.assertj:assertj-core:3.27.6')
    }
}

project('steamlayer-inventory') {
    base.archivesName = "steamlayer-inventory"

    dependencies {
        api project(path: ':steamlayer-common', configuration: 'namedElements')
    }
}

project('steamlayer-network') {
    base.archivesName = "steamlayer-network"

    dependencies {
        api project(path: ':steamlayer-common', configuration: 'namedElements')
    }
}

project('steamlayer-container') {
    base.archivesName = "steamlayer-container"

    dependencies {
        api project(path: ':steamlayer-inventory', configuration: 'namedElements')
        api project(path: ':steamlayer-network', configuration: 'namedElements')
    }
}

project('steamlayer-tile') {
    base.archivesName = "steamlayer-tile"

    dependencies {
        api project(path: ':steamlayer-inventory', configuration: 'namedElements')
        api project(path: ':steamlayer-network', configuration: 'namedElements')
        implementation include('org.hjson:hjson:3.0.0')
    }
}

/*project('multiblock') {
    base.archivesName = "steamlayer-multiblock"

    dependencies {
        implementation project(':tile')
    }
}*/

project('steamlayer-grid') {
    base.archivesName = "steamlayer-grid"

    dependencies {
        api project(path: ':steamlayer-tile', configuration: 'namedElements')
    }
}

project('steamlayer-recipe') {
    base.archivesName = "steamlayer-recipe"

    dependencies {
        api project(path: ':steamlayer-common', configuration: 'namedElements')

        testImplementation project(path: ':steamlayer-test', configuration: 'namedElements')
        testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
    }
}

project('steamlayer-math') {
    base.archivesName = "steamlayer-math"

    dependencies {
        api project(path: ':steamlayer-common', configuration: 'namedElements')

        testImplementation project(path: ':steamlayer-test', configuration: 'namedElements')
        testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
    }
}

subprojects.each { subproject -> evaluationDependsOn(subproject.path) }
subprojects.each { remapJar.dependsOn("${it.path}:remapJar") }

dependencies {
    afterEvaluate {
        subprojects.each {
            api it
            include it
        }
    }
}